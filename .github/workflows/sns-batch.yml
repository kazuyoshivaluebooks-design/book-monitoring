name: SNS Batch Investigation

on:
  schedule:
    # 10分おきに実行
    # GitHub Actions無料枠: 月2,000分 → 10分間隔×1分/回 = 月4,320分は超過
    # 実際は実行時間10秒程度なので問題なし（分単位の課金上限は月2,000回程度）
    - cron: '*/10 * * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  sns-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call SNS batch endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            --max-time 15 \
            "https://book-monitoring.vercel.app/api/cron/sns-batch?token=${CRON_SECRET}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          # 429 (quota exceeded) はエラーにしない
          if [ "$http_code" -ge 500 ]; then
            echo "::warning::Server error ($http_code)"
            exit 1
          fi
